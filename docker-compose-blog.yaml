version: '3.6'
services:
  mysql:
    image: mysql:8.0.22
    volumes:
      - "mysql-volume:/var/lib/mysql/data"
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=wangfj
    deploy:
      replicas: 0
      resources:
        limits:
          cpus: '6'
          memory: 12G
        reservations:
          cpus: ".500"
          memory: 4G

  blog-index:
    image: blog/index:latest
    environment:
      - SPRING_PROFILES_ACTIVE=pro
    deploy:
      restart_policy: {condition: on-failure, delay: 10s}
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: ".250"
          memory: 500M

  blog-manage:
    image: blog/manage:latest
    environment:
      - SPRING_PROFILES_ACTIVE=pro
    deploy:
      restart_policy: {condition: on-failure, delay: 10s}
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: ".250"
          memory: 500M

networks:
  host:
    external: true
volumes: {mysql-volume: null, index-volume: null, manage-volume: null}
