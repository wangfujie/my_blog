version: '3.6'
# docker stack deploy -c docker-compose-blog.yaml myblog
services:
  mysql:
    image: mysql:8.0.22
    volumes:
      - "mysql-volume:/var/lib/mysql"
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=wangfj
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 500M
        reservations:
          cpus: ".250"
          memory: 200M

  blog-index-web:
    image: blog-index-web:latest
    environment:
      - SPRING_PROFILES_ACTIVE=pro
    depends_on:
      # 确保 mysql 健康后再启动
      - mysql
    volumes:
      - "index-volume:/app/resource"
    healthcheck:
      test: [ "CMD-SHELL", "curl -sS http://127.0.0.1:8088/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 300s
    deploy:
      restart_policy: {condition: on-failure, delay: 10s}
      mode: replicated
      replicas: 1
      resources:
        # 服务最大限制资源
        limits:
          cpus: '0.5'
          memory: 500M
        # 服务最低满足资源
        reservations:
          cpus: ".250"
          memory: 300M

  blog-manage-web:
    image: blog-manage-web:latest
    depends_on:
      # 确保 mysql 健康后再启动
      - mysql
    volumes:
      - "manage-volume:/app/resource"
    environment:
      - SPRING_PROFILES_ACTIVE=pro
    healthcheck:
      test: [ "CMD-SHELL", "curl -sS http://127.0.0.1:8089/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 300s
    deploy:
      restart_policy: {condition: on-failure, delay: 10s}
      mode: replicated
      replicas: 1
      resources:
        # 服务最大限制资源
        limits:
          cpus: '0.5'
          memory: 500M
        # 服务最低满足资源
        reservations:
          cpus: ".250"
          memory: 200M

volumes: {mysql-volume: null, index-volume: null, manage-volume: null}
