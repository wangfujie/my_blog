server:
  port: 8098
baidu:
  commitUrls:
    syncTime: 0 0 0/1 * * ?
file:
  staticAccessPath: /blog/
  uploadPath: /app/resource/upload-path/
resource:
  upload-path: /app/resource/resource-file/

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/my_blog?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=GMT%2B8&amp&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  http:
    multipart:
      max-file-size: 200mb
      max-request-size: 200mb
